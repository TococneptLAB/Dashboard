<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>แผนผังแล็บ — TOTU Concept Lab</title>
<link rel="icon" type="image/png" href="favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600&family=Noto+Sans+Thai:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0c10;--ink:#f4f4f2;--mute:#9b9ca3;--line:#2a2c35;--gold:#f2c14e;--ok:#5fd1a0}
*{box-sizing:border-box;margin:0}
body{background:radial-gradient(1200px 600px at 50% -200px,#1b2030,#0b0c10);color:var(--ink);font-family:'Noto Sans Thai',system-ui,sans-serif;min-height:100vh;line-height:1.5}
.top{max-width:1180px;margin:0 auto;padding:22px 18px 8px;display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap}
.brand{font-family:'Montserrat',system-ui,sans-serif;letter-spacing:.26em;font-size:12px;font-weight:600;color:var(--mute)}
h1{font-size:26px;font-weight:500;margin-top:4px}
.stats{display:flex;gap:10px;flex-wrap:wrap}
.stat{background:#14161d;border:1px solid var(--line);border-radius:14px;padding:8px 14px;min-width:92px}
.stat b{display:block;font-size:22px;font-weight:600;line-height:1.1}.stat span{font-size:12px;color:var(--mute)}
.bar{max-width:1180px;margin:0 auto;padding:6px 18px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;color:var(--mute);font-size:13px}
.bar a,.bar button{color:var(--ink);background:#14161d;border:1px solid var(--line);border-radius:99px;padding:6px 14px;font:inherit;font-size:13px;cursor:pointer;text-decoration:none}
.map{max-width:1180px;margin:10px auto 60px;padding:0 18px;display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
@media(max-width:900px){.map{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){.map{grid-template-columns:1fr}}
.room{position:relative;border-radius:22px;border:3px solid var(--rc);background:
  conic-gradient(var(--rt) 25%,var(--rt2) 0 50%,var(--rt) 0 75%,var(--rt2) 0) 0 0/36px 36px;
  padding:0 0 14px;min-height:210px;box-shadow:0 10px 30px #0008, inset 0 0 0 4px #0003;overflow:hidden}
.room.wide{grid-column:span 2}
@media(max-width:560px){.room.wide{grid-column:auto}}
.rh{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 12px;background:var(--rc);color:#10131a;font-weight:600;font-size:14px}
.rh .ic{font-size:18px;margin-right:6px}.rh .rn{background:#10131a;color:#fff;border-radius:99px;font-size:12px;padding:2px 10px;white-space:nowrap}
.tod{padding:4px 14px 0;font-size:12px;color:#fff;opacity:.85;margin:2px 0 4px}.tod b{font-size:14px}
.rh .rn.hot{background:#fff;color:#b85a00}
.furn{display:flex;gap:10px;padding:10px 14px 0;font-size:22px;opacity:.9;filter:drop-shadow(0 2px 0 #0003)}
.crew{display:flex;flex-wrap:wrap;gap:6px 14px;padding:8px 12px 0;justify-content:flex-start;align-items:flex-end}
.empty{padding:26px 14px;color:#10131a99;font-size:13px;text-align:center;width:100%}
.av{position:relative;width:84px;text-align:center;cursor:pointer;padding-top:30px;background:none;border:0;color:inherit;font:inherit}
.av .bub{position:absolute;top:0;left:50%;transform:translateX(-50%);background:var(--gold);color:#2b1d00;border:2px solid #2b1d00;border-radius:12px;font-size:12px;font-weight:600;padding:1px 8px;white-space:nowrap}
.av .bub::after{content:"";position:absolute;left:50%;bottom:-7px;margin-left:-5px;border:5px solid transparent;border-top-color:#2b1d00;border-bottom:0}
.av.on .nm{background:#1f8f4a;color:#fff;border-radius:99px;padding:1px 8px;display:inline-block}
.av.on .guy{filter:drop-shadow(0 0 7px #3ddc84)}
.av.on::after{content:"";position:absolute;top:34px;right:8px;width:12px;height:12px;border-radius:50%;background:#3ddc84;border:2px solid #0b0d12;box-shadow:0 0 8px #3ddc84}
.av.on:not(.work) .bub{background:#c9f7d8;color:#0d4a24;border-color:#1f8f4a}.av.on:not(.work) .bub::after{border-top-color:#1f8f4a}
.av.idle .bub{background:#e6e6ea;color:#444;border-color:#555}.av.idle .bub::after{border-top-color:#555}
.desk{position:relative;height:22px;margin:0 6px;background:#b8793e;border:2px solid #5a3515;border-radius:8px 8px 4px 4px}
.desk::before{content:"";position:absolute;left:50%;top:-14px;width:26px;height:16px;margin-left:-13px;background:#2f3a4a;border:2px solid #10151d;border-radius:3px}
.av.work .desk::before{background:#7fe3ff;box-shadow:0 0 10px #7fe3ff}
.guy{position:relative;height:40px;margin-top:-30px;z-index:2;pointer-events:none}
.head{position:absolute;left:50%;top:0;width:26px;height:26px;margin-left:-13px;border-radius:50%;background:var(--skin);border:2px solid #2a1a12}
.head::before{content:"";position:absolute;left:-2px;top:-3px;width:26px;height:13px;border-radius:13px 13px 3px 3px;background:var(--hair);border:2px solid #2a1a12;border-bottom:0}
.head::after{content:"";position:absolute;left:5px;top:11px;width:12px;height:4px;border-top:2px solid #2a1a12;border-radius:0 0 8px 8px;border-top:0;border-bottom:2px solid #2a1a12}
.body{position:absolute;left:50%;top:24px;width:34px;height:16px;margin-left:-17px;border-radius:12px 12px 2px 2px;background:var(--shirt);border:2px solid #2a1a12}
.av.work .guy{animation:type .5s infinite alternate}
@keyframes type{from{transform:translateY(0)}to{transform:translateY(-2px)}}
.av.idle .guy{opacity:.55;filter:grayscale(.6)}
.av.idle .head::after{border-bottom:0;border-top:2px solid #2a1a12;top:14px}
.zz{position:absolute;right:6px;top:8px;font-size:12px;color:#fff;animation:zz 2s infinite;opacity:0}
.av.idle .zz{opacity:1}
@keyframes zz{0%{transform:translateY(6px);opacity:0}40%{opacity:1}100%{transform:translateY(-8px);opacity:0}}
.nm{font-size:12.5px;font-weight:500;margin-top:3px;color:#10131a;word-break:break-word}
.sm{font-size:11px;color:#10131acc}
.star{display:inline-block;background:#10131a;color:var(--gold);border-radius:99px;font-size:10.5px;padding:0 6px;margin-top:2px}
.legend{max-width:1180px;margin:0 auto;padding:0 18px 8px;color:var(--mute);font-size:12.5px;display:flex;gap:16px;flex-wrap:wrap}
.login{max-width:360px;margin:12vh auto;padding:24px;background:#14161d;border:1px solid var(--line);border-radius:18px}
.login input{width:100%;margin-top:10px;background:#0b0c10;border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:12px;font:inherit}
.login button{margin-top:14px;width:100%;background:var(--ink);color:#000;border:0;border-radius:10px;padding:12px;font:inherit;font-weight:600;cursor:pointer}
.err{color:#ff8a80;font-size:13.5px;min-height:20px;margin-top:8px}
.sheet{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;z-index:20;padding:16px}
.sheet.on{display:flex}
.card{background:#14161d;border:1px solid var(--line);border-radius:18px;max-width:420px;width:100%;max-height:80vh;overflow:auto;padding:18px}
.card h3{font-weight:500;font-size:18px}.card .s{color:var(--mute);font-size:13px;margin:2px 0 10px}
.card li{list-style:none;border-top:1px solid var(--line);padding:8px 0;font-size:14px;display:flex;justify-content:space-between;gap:10px}
.wl{border-top:1px solid var(--line);margin-top:12px;padding-top:8px}.wl h4{font-weight:500;font-size:15px;margin-bottom:4px}
.wi{border-left:3px solid #e45858;padding:4px 8px;margin:6px 0;font-size:13px}.wi.void{opacity:.5;text-decoration:line-through}.wi small{display:block;color:var(--mute)}.wi a{color:#7fb4ff;font-size:12px}
.wi.old{opacity:.7}.chip{display:inline-block;background:#2a2d3a;border-radius:99px;padding:1px 8px;margin:2px 4px 2px 0;font-size:12px}.chip.hot,.wg label.hot{color:#ff8a8a}
.wg{margin:8px 0;font-size:13px}.wg label{display:block;padding:2px 0}.wg b{display:block;color:var(--mute);font-weight:500;margin-top:4px}.wsr{display:none;background:#3a1f1f;border:1px solid #e45858;border-radius:8px;padding:6px 8px;font-size:12px;margin:6px 0}
.wf label{display:block;font-size:12px;color:var(--mute)}.wf label.wr{color:var(--ink);font-size:13px}.wf label.wr input{display:inline;width:auto}.wf button{margin-top:8px}.wf .s{color:var(--mute);font-size:12px}
.wf summary{cursor:pointer;margin:8px 0;color:#7fb4ff}.wf select,.wf input,.wf textarea{display:block;width:100%;margin:6px 0;background:#0e1016;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font:inherit}
.card li small{color:var(--mute)}
.card button{margin-top:12px;background:#222530;color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:8px 16px;font:inherit;cursor:pointer}
@media(prefers-reduced-motion:reduce){.av.work .guy,.zz{animation:none}}
</style>
</head>
<body>
<div id="loginView" class="login" style="display:none">
  <div class="brand">TOTU CONCEPT LAB</div>
  <h1 style="font-size:20px;margin-top:6px">เข้าสู่ระบบเพื่อดูแผนผังแล็บ</h1>
  <input id="ln" placeholder="ชื่อพนักงาน" autocomplete="username">
  <input id="lp" placeholder="PIN" type="password" inputmode="numeric" autocomplete="current-password">
  <div class="err" id="lerr"></div>
  <button id="lgo" type="button">เข้าสู่ระบบ</button>
</div>

<div id="mapView" style="display:none">
  <div class="top">
    <div><div class="brand">TOTU CONCEPT LAB</div><h1>🗺️ แผนผังแล็บ</h1></div>
    <div class="stats" id="stats"></div>
  </div>
  <div class="bar"><span id="upd">กำลังโหลด…</span><button id="rf" type="button">⟳ รีเฟรช</button><a href="app.html#chat" target="_blank" rel="noopener" id="chl">💬 แชท</a><button id="ed" type="button" style="display:none">✏ จัดห้องพนักงาน</button><a href="app.html">← กลับไปหน้าแอป</a></div>
  <div class="legend"><span>🟡 ฟองสีเหลือง = กำลังทำงานอยู่ (จำนวนเคส)</span><span>💤 เทา = ยังไม่เช็กอิน/ยังไม่เริ่มงานวันนี้</span><span>🕘 เวลาเข้างานมาจากการเช็กอินในรัศมีแล็บ</span><span>⭐ = ขั้นตอนที่ทำเสร็จวันนี้</span><span>กดที่ตัวละครเพื่อดูว่าทำเคสไหนอยู่</span></div>
  <div class="map" id="map"></div>
</div>

<div class="sheet" id="sheet"><div class="card" id="card"></div></div>

<script>
var API='', EMP=null, DATA=null, BOARD=null, TIMER=null;
var ROOMS=[
 {id:'office',ic:'🏢',name:'สำนักงาน / รับออเดอร์',keys:['order_intake','billing'],rc:'#8fb4ff',rt:'#26304a',rt2:'#2b3654',furn:'🖥️ 🗂️ ☕',wide:false},
 {id:'scan',ic:'📷',name:'SCAN',keys:['scan'],rc:'#7fe0c8',rt:'#1f3a38',rt2:'#244341',furn:'📷 🦷'},
 {id:'design',ic:'🖥️',name:'DESIGN',keys:['design'],rc:'#c4a6ff',rt:'#2e2650',rt2:'#352c5c',furn:'🖥️ 🖱️ 🎨'},
 {id:'print',ic:'🖨️',name:'MODEL PRINTING',keys:['model_printing'],rc:'#ffb38a',rt:'#46301f',rt2:'#4f3723',furn:'🖨️ 🧪'},
 {id:'abut',ic:'🔩',name:'Abutment (สั่ง / รับของ)',keys:['abutment','receive'],rc:'#ffd76a',rt:'#443a1b',rt2:'#4d4220',furn:'📦 🔩'},
 {id:'mill',ic:'⚙️',name:'MILLING / PRESS',keys:['milling','milling_zir','milling_emax','milling_premill'],rc:'#9ad1ff',rt:'#1d3446',rt2:'#223c50',furn:'⚙️ 🔧 🔥',wide:true},
 {id:'ceramic',ic:'🎨',name:'พอชเลน / ALL CERAMIC',keys:['all_ceramic'],rc:'#ff9ec7',rt:'#46233a',rt2:'#4f283f',furn:'🎨 🖌️ ✨'},
 {id:'qc',ic:'✅',name:'QC',keys:['qc'],rc:'#8be28b',rt:'#1f3b24',rt2:'#244429',furn:'🔍 ✅'},
 {id:'deliv',ic:'🚚',name:'DELIVERY',keys:['delivery'],rc:'#f5a3a3',rt:'#452626',rt2:'#4e2b2b',furn:'🚚 📬'}
];
var LABEL={order_intake:'รับออเดอร์',scan:'SCAN',design:'DESIGN',model_printing:'MODEL PRINTING',abutment:'สั่ง Abutment',receive:'รับของ',milling:'MILLING',milling_zir:'MILLING Zirconia',milling_emax:'PRESS Emax',milling_premill:'MILLING Premill',all_ceramic:'พอชเลน',qc:'QC',billing:'ออกบิล',delivery:'DELIVERY'};
var ALLKEYS=Object.keys(LABEL);
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function tokensOf(str){ return String(str||'').split(/[,;\/\n|]+/).map(function(t){return t.trim().toLowerCase();}).filter(Boolean); }
function keysForToken(tok){
  var k=[]; ALLKEYS.forEach(function(x){ if(tok===x.toLowerCase()||tok===LABEL[x].toLowerCase()||tok===x.replace('_',' ')) k.push(x); });
  if(tok==='cadcam'||tok==='cad'||tok==='cam') k.push('scan','design','model_printing','milling','milling_zir','milling_emax','milling_premill');
  if(tok==='milling'||tok==='กลึง') k.push('milling','milling_zir','milling_emax','milling_premill');
  if(tok==='milling zirconia'||tok==='milling zir'||tok==='zirconia'||tok==='กลึง zirconia') k.push('milling_zir');
  if(tok==='milling emax'||tok==='emax'||tok==='กลึง emax'||tok==='press emax'||tok==='press'||tok==='เพรส') k.push('milling_emax');
  if(tok==='milling premill'||tok==='premill'||tok==='กลึง premill') k.push('milling_premill');
  if(tok==='model'||tok==='print'||tok==='printing'||tok==='พิมพ์โมเดล') k.push('model_printing');
  if(tok==='all ceramic'||tok==='allceramic'||tok==='porcelain'||tok==='พอชเลน') k.push('all_ceramic');
  if(tok==='admin') k.push('order_intake','abutment','receive','billing','delivery');
  if(tok==='สแกน') k.push('scan'); if(tok==='รับออเดอร์') k.push('order_intake'); if(tok==='รับของ') k.push('receive'); if(tok==='ออกบิล') k.push('billing');
  return k;
}
function deptKeysOf(e){ var t=tokensOf(e.depts); if(!t.length) return null; var s={}; t.forEach(function(x){ keysForToken(x).forEach(function(k){ s[k]=1; }); }); return Object.keys(s); }
function isAdmin(e){ var r=String(e.role||'').trim().toLowerCase(), d=String(e.department||'').trim().toLowerCase(); return r==='admin'||r==='ceo'||(r===''&&d==='admin')||d==='ceo'; }
function ymd(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function dayOf(v){ if(!v) return ''; var s=String(v); if(/^\d{4}-\d{2}-\d{2}$/.test(s)) return s; var d=new Date(s); return isNaN(d)?'':ymd(d); }
function roomOfKey(k){ for(var i=0;i<ROOMS.length;i++) if(ROOMS[i].keys.indexOf(k)>=0) return ROOMS[i].id; return 'office'; }

// pure: boot (bootstrap result) + today (yyyy-mm-dd) -> {people:[{name,room,wip:[{case_id,dept}],done:n,assigned:n,present}], inLab, wipTotal, workingPeople}
function compute(boot, today, board, rooms){
  var OV={}; (boot.overrides||[]).forEach(function(r){ var k=String(r.dept_key||''); if(!k||k.charAt(0)==='_') return; (OV[r.id]=OV[r.id]||{})[k]=r; });
  var per={}, inLab=0, RS={}, RL={}; Object.keys(rooms||{}).forEach(function(k){ RL[String(k).toLowerCase()]=rooms[k]; });
  (boot.employees||[]).forEach(function(e){ if(String(e.role||'').trim().toLowerCase()==='ceo'||String(e.department||'').trim().toLowerCase()==='ceo'||String(e.name||'').trim().toLowerCase()==='ceo') return; per[e.name]={name:e.name,emp:e,wip:[],done:0,assigned:0,touched:false}; });
  function P(n){ n=String(n||'').trim(); return per[n]||null; }
  (boot.orders||[]).forEach(function(o){
    if(o.status==='ยกเลิกเคส') return;
    var live=o.status!=='ส่งแล้ว'; if(live) inLab++;
    var asg={}; try{ asg=JSON.parse(o.assign||'{}')||{}; }catch(e){}
    ALLKEYS.forEach(function(k){
      var ov=(OV[o._id]||{})[k]||{}, st=ov.status||o['dep_'+k]||'ไม่เกี่ยวข้อง', by=ov.updated_by||'';
      var start=ov.start||o['dep_'+k+'_start']||'', end=ov.end||o['dep_'+k+'_end']||'', p=P(by);
      if(live&&st==='กำลังดำเนินการ'&&p){ p.wip.push({case_id:o.case_id,dept:k}); p.touched=true; }
      if(st==='เสร็จแล้ว'&&dayOf(end)===today){ var rid=roomOfKey(k); RS[rid]=RS[rid]||{steps:0,teeth:0}; RS[rid].steps++; RS[rid].teeth+=Number(o.qty)||0; }
      if(st==='เสร็จแล้ว'&&p&&dayOf(end)===today){ p.done++; p.touched=true; }
      else if(p&&dayOf(start)===today&&st!=='ไม่เกี่ยวข้อง'){ p.touched=true; }
      if(live&&asg[k]&&P(asg[k])&&st!=='เสร็จแล้ว'&&st!=='ไม่เกี่ยวข้อง'&&st!=='ยกเลิก') P(asg[k]).assigned++;
    });
  });
  var people=Object.keys(per).map(function(n){
    var p=per[n], e=p.emp, room='office';
    if(p.wip.length){ var c={}; p.wip.forEach(function(w){ var r=roomOfKey(w.dept); c[r]=(c[r]||0)+1; }); room=Object.keys(c).sort(function(a,b){return c[b]-c[a];})[0]; }
    else if(!isAdmin(e)){ var ks=deptKeysOf(e); if(ks&&ks.length) room=roomOfKey(ks[0]); }
    var rl=(RL[String(n).toLowerCase()]||[]).filter(function(id){ return ROOMS.some(function(r){return r.id===id;}); }), rs=[room];
    if(rl.length){ rs=rl.slice(); room=rs[0]; }          // fixed rooms: work in a room not on the list is counted in the first listed room
    var b=board&&board[n]; var present=board?!!(b&&b.in_at):p.touched;      // with attendance data, "present" = checked in today
    return {name:n,room:room,rooms:rs,custom:rl.length>0,wip:p.wip,done:p.done,assigned:p.assigned,present:present||p.wip.length>0,inAt:b&&b.in_at||'',outAt:b&&b.out_at||'',late:b&&b.st&&b.st.kind==='late'?b.st.late:0};
  });
  return {roomStats:RS,people:people,inLab:inLab,wipTotal:people.reduce(function(a,p){return a+p.wip.length;},0),working:people.filter(function(p){return p.wip.length;}).length,present:people.filter(function(p){return p.present;}).length};
}
function hash(s){ var h=0; for(var i=0;i<s.length;i++) h=(h*31+s.charCodeAt(i))>>>0; return h; }
var SKIN=['#f2c9a0','#e0a878','#c68642','#8d5524','#f6d7b8'], HAIR=['#2a1a12','#5a3a1e','#1c1c1c','#8a5a2b','#c9a24a','#7a2d2d','#3b3b6b'], SHIRT=['#e45858','#4a90e2','#50b86c','#e8a33d','#9b6ad8','#e86fa4','#3bb8b0','#f0f0f0'];
function hmm(iso){ var d=new Date(iso); return isNaN(d)?'':d.toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'}); }
function avatar(p){
  var h=hash(p.name), cls=p.wip.length?'work':(p.present?'':'idle');
  var bub=p.wip.length?('🔧 '+p.wip.length+' เคส'):(p.outAt?'🏠 กลับแล้ว':(p.inAt?('เข้า '+hmm(p.inAt)+(p.late?' ⚠สาย':'')):(p.present?'พักอยู่':'💤')));

    [].forEach.call(box.querySelectorAll('[data-p]'),function(a){ a.onclick=function(e){ e.preventDefault(); var w=r.warnings.filter(function(x){return x.id===a.getAttribute('data-p');})[0]; if(w) printWarn(w,items); }; });
    [].forEach.call(box.querySelectorAll('[data-f]'),function(a){ a.onclick=function(e){ e.preventDefault(); var w=r.warnings.filter(function(x){return x.id===a.getAttribute('data-f');})[0]; if(w) pdfWarn(w,items); }; });
    [].forEach.call(box.querySelectorAll('[data-v]'),function(a){ a.onclick=function(e){ e.preventDefault(); if(!confirm('ยกเลิกใบเตือนใบนี้? (ยังเก็บประวัติไว้ แต่ไม่นับ)')) return; post({action:'warnVoid',id:a.getAttribute('data-v')}).then(function(){ loadWarn(name); }); }; });
  }).catch(function(){ var b=document.getElementById('wl'); if(b) b.innerHTML='<small>เชื่อมต่อไม่ได้</small>'; });
}
document.getElementById('sheet').addEventListener('click',function(e){ if(e.target===this) this.classList.remove('on'); });
function post(body){ return fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({},body,EMP&&EMP.token?{token:EMP.token}:{}))}).then(function(r){return r.json();}); }
function load(){
  return post({action:'bootstrap'}).then(function(r){
    if(!r||!r.ok){ if(r&&(r.error==='unauthorized'||r.error==='forbidden'||r.error==='bad_token')){ showLogin('หมดเวลาเข้าสู่ระบบ กรุณาเข้าสู่ระบบใหม่'); } else { document.getElementById('upd').textContent='ดึงข้อมูลไม่สำเร็จ ลองรีเฟรชอีกครั้ง'; } return; }
    DATA=r;
    return post({action:'attendBoard'}).then(function(b){ BOARD=null; ROOMMAP=(b&&b.rooms)||{}; if(b&&b.ok){ BOARD={}; (b.rows||[]).forEach(function(x){ BOARD[x.name]=x; }); } }).catch(function(){ BOARD=null; }).then(draw);
  }).catch(function(){ document.getElementById('upd').textContent='เชื่อมต่อไม่ได้ ลองรีเฟรชอีกครั้ง'; });
}
function showMap(){ document.getElementById('ed').style.display=EMP&&isAdmin(EMP)?'':'none'; document.getElementById('loginView').style.display='none'; document.getElementById('mapView').style.display='block'; load(); clearInterval(TIMER); TIMER=setInterval(load,30000); }
function showLogin(msg){ clearInterval(TIMER); document.getElementById('mapView').style.display='none'; document.getElementById('loginView').style.display='block'; document.getElementById('lerr').textContent=msg||''; }
var ROOMMAP={};
// default seating (set by the owner 20 Oct): used until the admin saves a different arrangement for that person
var DEFAULT_ROOMS={dew:['office'],admin:['office','abut'],biw:['scan','print','abut','mill'],jom:['scan','print','abut','mill'],aem:['print','mill'],tuck:['deliv'],mon:['deliv']};
function effRooms(){ var m={}; Object.keys(DEFAULT_ROOMS).forEach(function(k){ m[k]=DEFAULT_ROOMS[k]; }); Object.keys(ROOMMAP||{}).forEach(function(k){ m[String(k).toLowerCase()]=ROOMMAP[k]; }); return m; }
document.getElementById('rf').onclick=load;
function editRooms(){
  var people=(window.LAB.last&&window.LAB.last.people)||[]; if(!people.length) return;
  var h='<h3>จัดห้องพนักงาน</h3><div class="s">ติ๊กห้องที่คนนี้ประจำ (เลือกได้หลายห้อง) • ไม่ติ๊กเลย = ให้ระบบจัดเองตามแผนกที่ตั้งไว้</div><div style="overflow:auto">';
  people.slice().sort(function(a,b){return a.name.localeCompare(b.name,'th');}).forEach(function(p){
    h+='<div style="border-top:1px solid var(--line);padding:8px 0"><b>'+esc(p.name)+'</b><div style="display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:4px">'+ROOMS.map(function(r){ return '<label style="font-size:13px"><input type="checkbox" class="er" data-n="'+esc(p.name)+'" value="'+r.id+'"'+(((effRooms()[String(p.name).toLowerCase()])||[]).indexOf(r.id)>=0?' checked':'')+'> '+r.ic+' '+esc(r.name.split(' ')[0])+'</label>'; }).join('')+'</div></div>';
  });
  h+='</div><button type="button" id="esv">💾 บันทึก</button> <button type="button" id="ecl">ปิด</button>';
  document.getElementById('card').innerHTML=h; document.getElementById('sheet').classList.add('on');
  document.getElementById('ecl').onclick=function(){ document.getElementById('sheet').classList.remove('on'); };
  document.getElementById('esv').onclick=function(){
    var m={}; [].forEach.call(document.querySelectorAll('.er:checked'),function(c){ (m[c.getAttribute('data-n')]=m[c.getAttribute('data-n')]||[]).push(c.value); });
    post({action:'setLabRooms',map:m}).then(function(r){ if(r&&r.ok){ ROOMMAP=r.rooms; document.getElementById('sheet').classList.remove('on'); draw(); } else alert(r&&r.error==='forbidden'?'เฉพาะแอดมิน':'บันทึกไม่สำเร็จ (ต้องใช้หลังบ้าน v46 ขึ้นไป)'); }).catch(function(){ alert('เชื่อมต่อไม่ได้'); });
  };
}
document.getElementById('ed').onclick=editRooms;
document.getElementById('lgo').onclick=function(){
  var n=document.getElementById('ln').value.trim(), p=document.getElementById('lp').value.trim(); if(!n||!p){ document.getElementById('lerr').textContent='กรุณากรอกชื่อและ PIN'; return; }
  post({action:'login',name:n,pin:p}).then(function(r){
    if(r&&r.ok){ EMP=Object.assign({},r.employee,{token:r.token}); try{ localStorage.setItem('totu_employee',JSON.stringify(EMP)); }catch(e){} showMap(); }
    else document.getElementById('lerr').textContent=(r&&r.error==='locked')?'ใส่ PIN ผิดหลายครั้ง ถูกล็อกชั่วคราว 15 นาที':'ชื่อหรือ PIN ไม่ถูกต้อง';
  }).catch(function(){ document.getElementById('lerr').textContent='เชื่อมต่อไม่ได้'; });
};
window.LAB={compute:compute,ROOMS:ROOMS,last:null};
(function init(){
  try{ EMP=JSON.parse(localStorage.getItem('totu_employee')||'null'); }catch(e){}
  var u=''; try{ u=localStorage.getItem('totu_api_url')||''; }catch(e){}
  function go(){ if(EMP&&EMP.token) showMap(); else showLogin(''); }
  if(/^https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec$/.test(u)){ API=u; go(); }
  else fetch('config.json').then(function(r){return r.json();}).then(function(c){ API=c.api_url; go(); }).catch(function(){ showLogin('โหลดการตั้งค่าไม่สำเร็จ'); });
})();
</script>
