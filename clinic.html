<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>ตรวจสอบสถานะงาน — TO CONCEPT LAB</title>
<link rel="icon" type="image/png" href="favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500&family=Noto+Sans+Thai:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#000;--ink:#f4f4f2;--mute:#9a9a96;--line:#2a2a2c;--accent:#5fd1c4;--warn:#e8b25a}
*{box-sizing:border-box;margin:0}body{background:var(--bg);color:var(--ink);font-family:'Noto Sans Thai',system-ui,sans-serif;font-weight:300;line-height:1.6;min-height:100vh}
.wrap{max-width:860px;margin:0 auto;padding:28px 20px 60px}
.brand{font-family:'Montserrat',system-ui,sans-serif;letter-spacing:.28em;font-size:13px;font-weight:500}
a{color:var(--accent)}
h1{font-size:26px;font-weight:400;margin:34px 0 6px}.sub{color:var(--mute);font-size:14.5px}
.box{margin-top:22px;display:flex;gap:10px;flex-wrap:wrap}
input{flex:1;min-width:200px;background:#0b0b0c;border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:13px 14px;font:inherit;font-size:17px;letter-spacing:2px;text-transform:uppercase}
button{background:var(--ink);color:#000;border:0;border-radius:10px;padding:13px 26px;font:inherit;font-weight:500;cursor:pointer}
.err{color:#ff8a80;margin-top:12px;min-height:24px;font-size:14.5px}
.hd{margin-top:30px;display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px}
.hd b{font-size:18px;font-weight:500}.hd span{color:var(--mute);font-size:13px}
.case{border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-top:14px;background:#08080a}
.case.done{opacity:.72}
.top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.cid{font-family:'Montserrat',system-ui,sans-serif;font-weight:500;letter-spacing:.06em;font-size:16px}
.pill{font-size:12.5px;padding:3px 12px;border-radius:99px;border:1px solid var(--accent);color:var(--accent);white-space:nowrap}
.pill.d{border-color:#6b8f6b;color:#9fd29f}.pill.h{border-color:var(--warn);color:var(--warn)}
.meta{color:var(--mute);font-size:13.5px;margin-top:6px}
.meta b{color:var(--ink);font-weight:400}
.steps{display:flex;gap:4px;margin-top:14px;flex-wrap:wrap}
.st{flex:1;min-width:84px;font-size:11.5px;color:var(--mute);border-top:3px solid var(--line);padding-top:5px}
.st.done{border-color:#6b8f6b;color:#9fd29f}.st.doing{border-color:var(--accent);color:var(--accent);font-weight:500}.st.next{border-color:var(--accent);color:var(--ink)}
.ab{margin-top:10px;font-size:13.5px;color:var(--warn);border-left:2px solid var(--warn);padding:2px 0 2px 10px}.ab.got{color:#9fd29f;border-color:#6b8f6b}.ab b{font-weight:500}.ab .sp{color:var(--mute);font-size:12.5px;margin:2px 0}.ab span{color:var(--mute)}
.cp{border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-top:14px;background:#08080a}.cpt{font-weight:500;margin-bottom:10px}
.cpg{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.cpk{border:1px solid var(--line);border-radius:12px;padding:12px 14px}.cpk.zero .kl{color:var(--warn)}.cpk.neg .kl{color:#ff8a80}
.kn{font-size:13.5px;color:var(--mute)}.kl{font-family:'Montserrat',system-ui,sans-serif;font-size:34px;font-weight:500;line-height:1.2;color:var(--accent)}.ks{font-size:12px;color:var(--mute)}
details{margin-top:10px;font-size:13.5px}summary{cursor:pointer;color:var(--mute)}.ul{display:flex;gap:14px;flex-wrap:wrap;padding:6px 0;border-bottom:1px solid var(--line);color:var(--mute)}.ul b{color:var(--ink);font-weight:400;min-width:5.5em}.ul.x{opacity:.55;text-decoration:line-through}
.empty{color:var(--mute);margin-top:30px}
.back{font-size:14px;color:var(--ink);text-decoration:none;border:1px solid var(--line);border-radius:99px;padding:7px 16px}.back:hover{border-color:var(--accent);color:var(--accent)}
footer{margin-top:50px;color:var(--mute);font-size:12.5px}
</style></head>
<body><div class="wrap">
<div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap"><a class="brand" href="./" style="text-decoration:none;color:inherit">TOTU CONCEPT LAB</a><a href="./" class="back">← กลับหน้าแรก</a></div>
<h1>ตรวจสอบสถานะงาน</h1>
<p class="sub">สำหรับคลินิกที่ใช้บริการ ใส่รหัสที่แล็บส่งให้ จะเห็นเฉพาะงานของคลินิกท่านเท่านั้น</p>
<form class="box" id="f"><input id="code" placeholder="รหัสคลินิก เช่น ABCDE-FGHJK" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="14"><button>ดูสถานะงาน</button></form>
<div class="err" id="err"></div>
<div id="out"></div>
<p style="margin-top:34px"><a href="./" class="back">← กลับหน้าแรก</a></p>
<p class="sub" style="margin-top:26px;font-size:12.5px"><span style="color:#9fd29f">▬</span> เสร็จแล้ว &nbsp; <span style="color:var(--accent)">▬</span> กำลังทำ / ถึงคิว &nbsp; <span style="color:#555">▬</span> ยังไม่ถึงขั้นตอน</p>
<footer>ข้อมูลอัปเดตตามที่แล็บบันทึกในระบบ หากมีข้อสงสัยกรุณาติดต่อแล็บทาง LINE @toconcept</footer>
</div>
<script>
var API = '';
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m];}); }
// คำศัพท์แล็บทันตกรรม: ชื่อขั้นตอนที่เซิร์ฟเวอร์ส่งมา -> คำที่คลินิกคุ้นเคย
var LAB={'รับงานเข้าแล็บ':'รับเคสเข้าแล็บ','สแกน':'สแกน / รับไฟล์','ออกแบบ':'ออกแบบ (CAD Design)','พิมพ์โมเดล':'พิมพ์โมเดล 3D','สั่ง/รอ Abutment':'สั่ง / รอ Abutment','ผลิต (กัด/อัด)':'กัด / อัดชิ้นงาน','ตกแต่งสี / เคลือบ':'ลงสี & Glaze','ตรวจคุณภาพ (QC)':'QC ตรวจงานก่อนส่ง','เตรียมจัดส่ง':'แพ็คงาน / รอจัดส่ง'};
function lab(l){ return LAB[l]||l; }
function pill(c){
  if(c.delivered) return 'ส่งมอบแล้ว';
  if(/พัก/.test(c.status)) return c.status;
  for(var i=0;i<c.stages.length;i++){ var s=c.stages[i]; if(s.state==='doing') return 'กำลังทำ: '+lab(s.label); if(s.state==='next') return 'ถึงคิว: '+lab(s.label); }
  return 'แพ็คงาน / รอจัดส่ง';
}
function fd(s){ if(!s) return '-'; var m=/^(\d{4})-(\d{2})-(\d{2})/.exec(s); return m? m[3]+'/'+m[2]+'/'+(+m[1]+543) : s; }
fetch('config.json').then(function(r){return r.json();}).then(function(c){ API=c.api_url; var q=new URLSearchParams(location.search).get('c'); if(q){ document.getElementById('code').value=q.toUpperCase(); go(); } }).catch(function(){});
document.getElementById('f').addEventListener('submit', function(e){ e.preventDefault(); go(); });
function go(){
  var code=document.getElementById('code').value.trim(), err=document.getElementById('err'), out=document.getElementById('out');
  err.textContent=''; if(!code){ err.textContent='กรุณาใส่รหัสคลินิก'; return; }
  if(!API){ err.textContent='ระบบยังไม่พร้อม ลองใหม่อีกครั้ง'; return; }
  out.innerHTML='<div class="empty">กำลังโหลด…</div>';
  fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'clinicStatus',code:code})}).then(function(r){return r.json();}).then(function(r){
    if(!r||!r.ok){ out.innerHTML=''; err.textContent = r&&r.error==='locked' ? 'มีการลองรหัสผิดหลายครั้ง กรุณารอสักครู่แล้วลองใหม่' : 'รหัสไม่ถูกต้อง หรือถูกปิดใช้งาน กรุณาตรวจสอบกับแล็บ'; return; }
    try{ history.replaceState(null,'',location.pathname); }catch(e){}
    var h='<div class="hd"><b>'+esc(r.clinic)+'</b><span>'+r.cases.length+' เคส</span></div>';
    var cp=r.coupons;
    if(cp&&cp.kinds){
      h+='<div class="cp"><div class="cpt">🎟 คูปองของคลินิก</div><div class="cpg">'+cp.kinds.map(function(k){ return '<div class="cpk'+(k.left<0?' neg':(k.left===0?' zero':''))+'"><div class="kn">'+esc(k.kind)+'</div><div class="kl">'+k.left+'</div><div class="ks">คงเหลือ · ให้ไว้ '+k.granted+' · ใช้ไป '+k.used+(k.left<0?' (ใช้เกินสิทธิ์)':'')+'</div></div>'; }).join('')+'</div>'+
      (cp.unkinded?'<div class="meta" style="color:var(--warn)">มี '+cp.unkinded+' เคสที่ยังไม่ได้ระบุประเภทคูปอง จึงยังไม่ถูกหักจากยอด</div>':'')+
      '<details><summary>ประวัติการใช้คูปอง ('+cp.usage.length+')</summary>'+(cp.usage.length?cp.usage.map(function(u){ return '<div class="ul'+(u.counted?'':' x')+'"><span>'+fd(u.date)+'</span><b>'+esc(u.case_id)+'</b><span>'+esc(u.patient)+'</span><span>'+esc(u.kind||'ยังไม่ระบุประเภท')+(u.counted?'':' (ยกเลิก/หมดอายุ)')+'</span></div>'; }).join(''):'<div class="meta">ยังไม่มีการใช้</div>')+'</details>'+
      '<details><summary>ประวัติการได้รับคูปอง ('+cp.grants.length+')</summary>'+(cp.grants.length?cp.grants.map(function(g){ return '<div class="ul"><span>'+fd(g.date)+'</span><b>'+(g.qty>0?'+':'')+g.qty+'</b><span>'+esc(g.kind)+'</span><span>'+(g.qty<0?'ปรับยอด':esc(g.doctor||''))+'</span></div>'; }).join(''):'<div class="meta">-</div>')+'</details></div>';
    }
    if(!r.cases.length) h+='<div class="empty">ขณะนี้ไม่มีเคสที่อยู่ในแล็บ</div>';
    r.cases.forEach(function(c){
      h+='<div class="case'+(c.delivered?' done':'')+'"><div class="top"><span class="cid">'+esc(c.case_id)+'</span><span class="pill '+(c.delivered?'d':(/พัก/.test(c.status)?'h':''))+'">'+esc(pill(c))+'</span></div>'+
      '<div class="meta"><b>'+esc(c.patient||'-')+'</b>'+(c.doctor?' · '+esc(c.doctor):'')+' · '+esc(c.material||'')+(c.qty?' × '+esc(c.qty):'')+'</div>'+
      '<div class="meta">รับงาน '+fd(c.date_received)+(c.ship_date?' · กำหนดส่งออก '+fd(c.ship_date):'')+(c.appointment_date?' · นัดคนไข้ '+fd(c.appointment_date):'')+(c.tracking_no?' · เลขพัสดุ <b>'+esc(c.tracking_no)+'</b>':'')+'</div>'+
      (c.abutments&&c.abutments.length?c.abutments.map(function(a){ var ST={received:'ได้รับ Abutment แล้ว',ordered:'สั่งแล้ว รอของมาถึง',requested:'กำลังดำเนินการสั่ง'}; return '<div class="ab'+(a.state==='received'?' got':'')+'">🔩 <b>'+(a.state==='received'?'':'รอ ')+'Abutment: '+esc(a.brand)+'</b>'+(a.spec?'<div class="sp">'+esc(a.spec).split(' + ').join('<br>')+'</div>':'')+'<span> — '+ST[a.state]+(a.qty>1&&!a.spec?' × '+a.qty:'')+'</span></div>'; }).join(''):'')+
      '<div class="steps">'+c.stages.map(function(s){ return '<div class="st '+(s.state==='todo'?'':s.state)+'">'+esc(lab(s.label))+'</div>'; }).join('')+'</div></div>';
    });
    out.innerHTML=h;
  }).catch(function(){ out.innerHTML=''; err.textContent='เชื่อมต่อไม่ได้ ลองใหม่อีกครั้ง'; });
}
</script></body></html>
